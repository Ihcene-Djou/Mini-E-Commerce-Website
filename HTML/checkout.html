<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", serif;
}

:root{
    --main: #B76E79;
    --dark-txt: #333;
    --light-txt: #888;
    --input-bg: #f4eceb;
}

body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(90deg, var(--input-bg), var(--main) );
}

.container{
    position: relative;
    border-radius: 30px;
    box-shadow: 0 0 30px rgba(0, 0, 0, .2);
    padding: 40px 25px;
    overflow: hidden;
    background: white;
    width: 400px;
}

.header{
    color: var(--dark-txt);
    text-align: center;
    margin-bottom: 10px;
    margin-top: -15px;
    color: var(--main);
}

.container p{
    color: var(--dark-txt);
    text-align: center;
    font-size: 14px;
}

.inputs{
    position: relative;
    margin: 15px 0;
}

.inputs input, .inputs select{
    width: 100%;
    padding: 13px 50px 13px 20px;
    background: var(--input-bg);
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 16px;
    font-weight: 500;
    color: var(--dark-txt);
}

.inputs input::placeholder{
   color: rgb(161, 152, 152);
   font-weight: 400;
}

.section-title{
    margin-top: 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--main);
}

.items{
    margin-bottom: -20px;
    color: var(--dark-txt);
    text-align: center;
}

.cart-box{
    background: var(--input-bg);
    padding: 2px;
    border-radius: 10px;
    margin: 15px 0;
    font-size: 14px;
    color: var(--dark-txt);
}

.btn{
    height: 48px;
    width: 100%;
    background: var(--main);
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, .1);
    border: none;
    cursor: pointer;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    margin-top: 20px;
}

.btn:hover{
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Checkout</h2>
    </div>

    <div class="section-title">Your Order</div>

    <div class="cart-box">    
    <div class="section-title items">
        Items: <span id="itemCount">0</span>
    </div>

    <div class="cart-box">
        <p>Total: <span id="totalPrice">0</span> DA</p>
    </div>
    </div>

    <div class="section-title">Shipping Info</div>

    <form action="" method="POST">
        <div class="inputs">
        <input type="text" placeholder="Full Name" required>
    </div>

    <div class="inputs">
        <input type="text" placeholder="Address" required>
    </div>

    <div class="inputs">
        <input type="text" placeholder="Phone Number" required>
    </div>

    <div class="section-title">Payment Method</div>

    <div class="inputs">
        <select>
            <option>Cash on Delivery</option>
            <option>Credit Card</option>
            <option>Bank Transfer</option>
        </select>
    </div>

    <button class="btn" onclick="placeOrder()">Place Order</button>
    </form>

</div>

<script src="../script.js"></script>
</body>
</html>
